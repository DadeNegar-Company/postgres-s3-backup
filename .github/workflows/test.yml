name: E2E Test

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test-backup:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        command: server /data
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up MinIO bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://my-backups

      - name: Seed test database
        env:
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U testuser -d testdb -c "CREATE TABLE test_table (id SERIAL PRIMARY KEY, name VARCHAR(50));"
          psql -h localhost -U testuser -d testdb -c "INSERT INTO test_table (name) VALUES ('test data 1'), ('test data 2');"

      - name: Build Docker image
        run: docker build -t postgres-s3-backup:test .

      - name: Run backup script via Docker
        run: |
          docker run --rm \
            --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=testdb \
            -e S3_BUCKET=my-backups \
            -e S3_ACCESS_KEY_ID=minioadmin \
            -e S3_SECRET_ACCESS_KEY=minioadmin \
            -e S3_ENDPOINT=http://localhost:9000 \
            postgres-s3-backup:test

      - name: Verify backup exists in S3 and check contents
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          FILES=$(aws --endpoint-url http://localhost:9000 s3 ls s3://my-backups/)
          echo "Files in S3:"
          echo "$FILES"

          if echo "$FILES" | grep -q 'testdb_.*\.sql\.gz'; then
            echo "Backup file found!"
          else
            echo "Backup file not found!"
            exit 1
          fi

          FILENAME=$(echo "$FILES" | grep 'testdb_.*\.sql\.gz' | awk '{print $4}')
          aws --endpoint-url http://localhost:9000 s3 cp s3://my-backups/$FILENAME ./backup.sql.gz
          gunzip ./backup.sql.gz

          if grep -q 'test data 1' ./backup.sql; then
            echo "Backup contents are correct!"
          else
            echo "Backup contents are missing expected data!"
            exit 1
          fi
